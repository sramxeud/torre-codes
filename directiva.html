<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Directiva · Panel de Control</title>
  <link rel="stylesheet" href="/styles/base.css" />
  <style>
    body { background: var(--bg, #0f172a); color: var(--text, #f1f5f9); font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
    .admin-container { max-width: 1100px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--surface, #1e293b); padding: 20px; border-radius: 8px; border-bottom: 3px solid var(--success, #22c55e); }
    .header h1 { margin: 0; }
    .btn-logout { background: var(--danger, #ef4444); color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    /* --- ESTILOS DE LA TARJETA DE TURNO --- */
    .turno-container {
      background: linear-gradient(135deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border, #475569);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .turno-foto {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--success, #22c55e);
      background-color: #333;
    }
    .turno-info h2 { margin: 0 0 5px 0; font-size: 22px; color: var(--success, #22c55e); text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
    .turno-info h3 { margin: 0 0 5px 0; font-size: 20px; }
    .turno-info p { margin: 0; color: var(--muted, #94a3b8); font-size: 14px; }
    .turno-info .telefono { margin-top: 10px; display: inline-block; background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; }

    .btn-download { background: var(--success, #22c55e); color: #000; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 15px; }
    .btn-download:hover { opacity: 0.9; }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: var(--surface-2, #334155); border: 1px solid var(--border, #475569); border-radius: 8px; padding: 15px; position: relative; }
    .card-trabajo { border-left: 4px solid var(--primary, #3b82f6); }
    .card-anuncio { border-left: 4px solid var(--warning, #f59e0b); }
    .card-anuncio.importante { border-left: 4px solid var(--danger, #ef4444); background: rgba(239, 68, 68, 0.05); }
    
    .card h3 { margin-top: 0; margin-bottom: 5px; }
    .card .meta { font-size: 12px; color: var(--muted, #94a3b8); margin-bottom: 10px; }
    .card .desc { font-size: 14px; line-height: 1.4; margin-bottom: 15px; }
    .fotos-container { display: flex; gap: 5px; flex-wrap: wrap; }
    .fotos-container img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border, #475569); cursor: pointer; }

    .section-title { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 15px; border-bottom: 1px solid var(--border, #475569); padding-bottom: 10px; }
    .section-title h2 { margin: 0; font-size: 20px; }
  </style>
</head>
<body>

  <div class="admin-container" id="panel-directiva" style="display: none;">
    
    <div class="header">
      <h1>Panel de Directiva</h1>
      <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
    </div>

    <!-- TARJETA DEL CONSERJE DE TURNO -->
    <div class="turno-container" id="tarjeta-turno" style="display: none;">
      <img id="turno-foto" class="turno-foto" src="" alt="Foto Conserje">
      <div class="turno-info">
        <h2>Conserje de Turno Hoy</h2>
        <h3 id="turno-nombre">Cargando...</h3>
        <p id="turno-dias"></p>
        <a id="turno-telefono" href="" class="telefono" target="_blank">📞 Llamar</a>
      </div>
    </div>

    <div id="vista-monitoreo">
      
      <!-- SECCIÓN ANUNCIOS -->
      <div class="section-title">
        <h2 style="color: var(--warning);">🚨 Anuncios e Incidentes Recientes</h2>
        <button class="btn-download" onclick="descargarRespaldoCSV()">⬇ Descargar Respaldo (CSV)</button>
      </div>
      <div id="contenedor-anuncios" class="grid-cards">
        <p>Cargando anuncios...</p>
      </div>

      <!-- SECCIÓN TRABAJOS -->
      <div class="section-title">
        <h2>Trabajos de Conserjes (Última semana)</h2>
      </div>
      <div id="contenedor-trabajos" class="grid-cards">
        <p>Cargando trabajos...</p>
      </div>

    </div>

  </div>

  <!-- Mensaje de carga inicial -->
  <div class="auth-container" id="loading-screen">
    <h1>Cargando panel...</h1>
    <p style="color:#94a3b8;">Verificando credenciales, por favor espera.</p>
  </div>

  <script type="module" src="/src/directiva/main.js"></script>
</body>
</html>
