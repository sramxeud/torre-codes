<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · Torre Codes</title>
  <link rel="stylesheet" href="/styles/base.css" />
  <style>
    /* Estilos específicos solo para los logos */
    .logos-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
      background: #0f172a; /* Fondo un poco más oscuro para resaltar */
      border-bottom: 1px solid #334155;
      border-radius: 8px 8px 0 0; /* Bordes suaves arriba */
    }

    .logos-header img {
      height: 70px; /* Logos más grandes */
      object-fit: contain;
      border-radius: 8px; /* Bordes suaves para las imágenes */
      background: white; /* Fondo blanco para que resalten */
      padding: 8px; /* Un poco de aire alrededor del logo */
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .divider-vertical {
      width: 1px;
      height: 50px;
      background-color: #475569;
    }

    /* Ajuste para que el contenedor principal no tenga el padding de arriba */
    .auth-container {
      padding-top: 0 !important;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    
    <!-- Sección de Logos -->
    <div class="logos-header">
      <img src="/logo-delger.png" alt="Delger Servicios Generales" />
      <div class="divider-vertical"></div>
      <img src="/logo-torre.png" alt="Torre Codes" />
    </div>

    <!-- El formulario original -->
    <div style="padding: 2rem;">
      <h1 style="text-align: center; margin-top: 0;">Bienvenido</h1>
      
      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" required autocomplete="email" placeholder="tu@correo.com" />

        <label for="password">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />

        <button type="submit" id="btn-login">Entrar</button>
        <div id="msg" hidden></div>
      </form>
      
      <div class="auth-links">
        <a href="/registro.html">Crear cuenta</a> · <a href="/forgot-password.html">Olvidé mi contraseña</a>
      </div>
    </div>

  </div>

  <script type="module" src="/src/auth-login.js"></script>
</body>
</html>
