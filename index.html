<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · Edificio</title>
  <link rel="stylesheet" href="/styles/base.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Iniciar sesión</h1>
    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required autocomplete="email" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" required autocomplete="current-password" />

      <button type="submit" id="btn-login">Entrar</button>
      <div id="msg" class="error-msg" hidden></div>
    </form>
    <div class="auth-links">
      <a href="/registro.html">Crear cuenta</a> · <a href="/forgot-password.html">Olvidé mi contraseña</a>
    </div>
  </div>
  <script type="module" src="/src/auth-login.js"></script>
</body>
</html>
