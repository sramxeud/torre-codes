
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión · Torre Codes</title>
  <link rel="stylesheet" href="/styles/base.css" />
  <style>
    /* Estilos específicos para el Login con logos */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a; /* Fondo oscuro base */
      padding: 1rem;
    }
    
    .login-card {
      background: #1e293b;
      width: 100%;
      max-width: 440px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .logos-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .logos-header img {
      height: 45px; /* Ajusta la altura según tus logos */
      object-fit: contain;
    }

    .divider-vertical {
      width: 1px;
      height: 40px;
      background-color: #334155;
    }

    .login-form-container {
      padding: 2rem;
    }

    .login-form-container h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: white;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Sección de Logos -->
      <div class="logos-header">
        <img src="/logo-delger.png" alt="Delger Servicios Generales" />
        <div class="divider-vertical"></div>
        <img src="/logo-torre.png" alt="Torre Codes" />
      </div>

      <!-- Formulario de Login -->
      <div class="login-form-container">
        <h2>Bienvenido</h2>
        <form id="login-form">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" required autocomplete="email" placeholder="tu@correo.com" />

          <label for="password">Contraseña</label>
          <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />

          <button type="submit" id="btn-login">Entrar al sistema</button>
          <div id="msg" hidden></div>
        </form>
        
        <div class="auth-links" style="margin-top: 1.5rem; text-align: center;">
          <a href="/registro.html">Crear una cuenta nueva</a> <br><br>
          <a href="/forgot-password.html" style="color: #94a3b8; font-size: 0.85rem;">¿Olvidaste tu contraseña?</a>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="/src/auth-login.js"></script>
</body>
</html>
